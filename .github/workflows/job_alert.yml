name: Job Alert Agent

on:
  schedule:
    # Runs every hour — GitHub Actions uses UTC time
    # 9 AM to 9 PM IST = 3:30 AM to 3:30 PM UTC
    - cron: '30 3,5,7,9,11,13,15 * * 1-5'  # Mon–Fri, every 2 hrs during IST work hours
  workflow_dispatch:  # allows you to run it manually from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 google-generativeai

      - name: Run job alert agent
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER:    ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:  ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECEIVER:  ${{ secrets.GMAIL_RECEIVER }}
        run: python job_agent.py

      - name: Save seen_jobs.json back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
